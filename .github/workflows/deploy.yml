name: Build & Deploy Frontend
run-name: Deploying ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      image: ${{ steps.set-tag.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase owner & repo + set tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG=${GITHUB_REF#refs/tags/}
          [[ "$TAG" == "$GITHUB_REF" ]] && TAG=latest
          echo "IMAGE=ghcr.io/$OWNER/$REPO" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            IDX_STOCK_SCREENER_BE=${{ secrets.IDX_STOCK_SCREENER_BE }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REPO=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            TAG="${{ github.ref_name }}" 

            IMAGE="ghcr.io/$OWNER/$REPO"

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Pulling $IMAGE:$TAG"
            docker pull "$IMAGE:$TAG"

            cd /home/${{ secrets.VPS_USER }}/stocks-screener
            export TAG="$TAG"

            docker compose pull frontend
            docker compose up -d --force-recreate --no-deps frontend

            docker image prune -f --filter "dangling=true"
